name: nocap-aivc-benchmark
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.13.1
  - scikit-learn=1.5.2
  - statsmodels=0.14.6
  - matplotlib=3.10.8
  - tqdm=4.67.1
  - scanpy=1.11.5
  - anndata=0.11.4
  - pyyaml=6.0.2
  - openpyxl=3.1.5
  - r-base=4.4.3
  - r-essentials
  - r-seurat=5.3.0
  - r-reticulate=1.43.0
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-ggplot2=4.0.0
  - r-readxl=1.4.5
  - r-writexl=1.5.4
  - r-foreach=1.5.2
  - r-doparallel=1.0.17
  - r-patchwork=1.3.2
  - r-rcolorbrewer=1.1_3
  - r-extrafont=0.20
  - r-gplots=3.2.0
  - r-pracma=2.4.4
  - r-stringr=1.5.2
  - r-stringi=1.8.7
  - r-viridis=0.6.5
  - r-purrr=1.1.0
  - r-scales=1.4.0
  - r-gridextra=2.3
  - r-devtools=2.4.6
  - pip:
      - torch==2.6.0
      - torch-geometric==2.6.1
      - torchtext==0.18.0
      - transformers==4.56.1
      - datasets==2.21.0
      - libpysal==4.13.0
      - esda==2.7.0
      - pybiomart==0.2.0
      - psutil==7.0.0
      # External model packages used by specific workflows and typically installed
      # from upstream repositories or local checkouts rather than PyPI:
      # gears, scgpt, geneformer, sclambda, scFoundation modules, geares.
      # R packages not reliably available from conda should be installed in R:
      # MuDataSeurat, scDEED, VGAM, resample, distances.
